spring.application.name=product-catalog
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/product_catalog}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:0000}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama3.1:8b
ai.logging.file=${AI_LOG_FILE:logs/ai-intent.log}
